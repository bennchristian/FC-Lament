<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KNOWN Test Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Layout: one phone, nothing around it. Full screen on a phone; a centered 390x844 frame on a laptop. Artifact 1's light look (cool ground, gold lamp), with a dark mode. */
:root{
  --bg:#EEF0F4; --bg2:#E3E7EE; --surface:#FFFFFF; --ink:#22283A; --muted:#5B6478; --line:#C9CFDA;
  --lamp:#F2B35E; --lamp-deep:#A8691F; --on-lamp:#22283A; --glow:rgba(242,179,94,.38); --chosen:#FFF4E2; --chosen-line:#E2A04A;
  --soft:#E7EAF0; --scrim:rgba(20,24,36,.45); --frame:#C9CFDA; --page:#DDE1E8; --os:#000000; --os-ink:#FFFFFF; --os-row:#1C1C1E; --os-muted:#8E8E93; --os-blue:#0A84FF;
  --draft-bg:#FFF1D6; --draft-ink:#7A4A12;
  --f-display:"Crimson Pro","Iowan Old Style",Georgia,serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#242A42; --bg2:#2D3450; --surface:#2F3654; --ink:#EDE6D8; --muted:#A9B0C4; --line:#3E4666;
  --lamp:#F2B35E; --lamp-deep:#F6C47E; --on-lamp:#242A42; --glow:rgba(242,179,94,.30); --chosen:#3B3A4C; --chosen-line:#C98F45;
  --soft:#2A3049; --scrim:rgba(5,7,14,.62); --frame:#3E4666; --page:#1A1F33; --draft-bg:#4A3A22; --draft-ink:#F6D9A8;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#242A42; --bg2:#2D3450; --surface:#2F3654; --ink:#EDE6D8; --muted:#A9B0C4; --line:#3E4666;
  --lamp:#F2B35E; --lamp-deep:#F6C47E; --on-lamp:#242A42; --glow:rgba(242,179,94,.30); --chosen:#3B3A4C; --chosen-line:#C98F45;
  --soft:#2A3049; --scrim:rgba(5,7,14,.62); --frame:#3E4666; --page:#1A1F33; --draft-bg:#4A3A22; --draft-ink:#F6D9A8;
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font:400 16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding-block:24px}
button{font:inherit;color:inherit;cursor:pointer}
textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lamp-deep);outline-offset:2px;border-radius:6px}

.phone{position:relative;width:390px;height:844px;max-height:calc(100dvh - 48px);background:var(--bg);border-radius:44px;overflow:hidden;box-shadow:0 0 0 1px var(--frame),0 30px 60px -30px rgba(0,0,0,.35);display:flex;flex-direction:column}
@media (max-width:520px){body{padding-block:0;place-items:stretch}.phone{width:100%;height:100%;max-height:none;border-radius:0;box-shadow:none}}

/* top bar */
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:22px 18px 6px 20px;min-height:68px}
.word{font:500 14px/1 var(--f-display);letter-spacing:.42em;color:var(--lamp-deep);padding-left:2px}
.word .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--lamp);margin-right:8px;vertical-align:1px;box-shadow:0 0 10px var(--glow)}
.tl,.tr{display:flex;align-items:center;gap:6px}
.ib{width:40px;height:40px;display:grid;place-items:center;border:0;background:none;border-radius:50%;color:var(--ink)}
.ib:hover{background:var(--bg2)}
.backb{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--muted);font-size:15px;padding:8px 6px;border-radius:8px}
.helpb{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px}
.prog{flex:none;height:3px;margin:0 24px 2px;border-radius:2px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--lamp);border-radius:2px;transition:width .5s ease}

/* content */
.content{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:10px 24px 20px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.content.center > :first-child{margin-top:auto}
.content.center > :last-child{margin-bottom:auto}
.actions{flex:none;padding:12px 24px 30px;display:flex;flex-direction:column;align-items:stretch;gap:10px}
h1{font:400 32px/1.12 var(--f-display);margin:0;text-wrap:balance;color:var(--ink)}
h1.sm{font-size:28px}
h2{font:400 24px/1.2 var(--f-display);margin:0;color:var(--ink);text-wrap:balance}
.lead{margin:0;color:var(--muted);font-size:16px;line-height:1.5}
.cap{margin:0;color:var(--muted);font-size:13.5px;line-height:1.45}
.eyebrow{margin:0;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.go{width:100%;min-height:54px;border:0;border-radius:27px;background:var(--lamp);color:var(--on-lamp);font-weight:700;font-size:16px}
.go[aria-disabled="true"],.sec[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.sec{width:100%;min-height:52px;border:1px solid var(--line);border-radius:26px;background:var(--surface);color:var(--ink);font-weight:600;font-size:15.5px}
.lnk{align-self:center;border:0;background:none;color:var(--ink);font-size:14.5px;font-weight:500;text-decoration:underline;text-underline-offset:3px;padding:6px 8px}
.lnk.muted{color:var(--muted)}
.privacy{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);line-height:1.45}

/* lamp */
.lamp{width:120px;height:120px;border-radius:50%;position:relative;flex:none;background:radial-gradient(circle at 50% 45%,#FFE7B8 0%,var(--lamp) 38%,rgba(242,179,94,0) 72%)}
.lamp::after{content:"";position:absolute;inset:-40px;border-radius:50%;background:radial-gradient(circle,var(--glow) 0%,transparent 65%);pointer-events:none}
.lamp.sm{width:64px;height:64px}.lamp.sm::after{inset:-24px}
.lamp.big{width:190px;height:190px;align-self:center;margin:26px 0 18px}
.lamp.breathe{animation:breathe 10s ease-in-out infinite}
@keyframes breathe{0%{transform:scale(.62)}40%{transform:scale(1)}100%{transform:scale(.62)}}
.cue{height:26px;text-align:center;color:var(--lamp-deep);font-weight:700;position:relative}
.cue span{position:absolute;left:0;right:0}
.cue .in{animation:cin 10s ease-in-out infinite}.cue .out{animation:cout 10s ease-in-out infinite}
@keyframes cin{0%,36%{opacity:1}40%,100%{opacity:0}}
@keyframes cout{0%,36%{opacity:0}40%,96%{opacity:1}100%{opacity:0}}

/* choices */
.lines{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.line{display:flex;gap:14px;align-items:flex-start;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:16px 4px;width:100%;color:var(--ink)}
.ring{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);margin-top:1px;transition:background .2s,border-color .2s,box-shadow .2s}
.line[aria-checked="true"] .ring,.line[aria-pressed="true"] .ring{border-color:var(--lamp);background:var(--lamp);box-shadow:inset 0 0 0 4px var(--bg)}
.box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);margin-top:1px;display:grid;place-items:center}
.line[aria-pressed="true"] .box{background:var(--lamp);border-color:var(--lamp);color:var(--on-lamp)}
.line .tx{display:flex;flex-direction:column;gap:2px;font-size:16px;line-height:1.4}
.line .tx small{font-size:13.5px;color:var(--muted)}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);text-align:left;color:var(--ink)}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t{font-weight:600;font-size:15.5px}.row .s{font-size:13.5px;color:var(--muted);line-height:1.4}
.stack{display:flex;flex-direction:column;gap:10px}

/* pictures */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;aspect-ratio:3/4;border:0;padding:0;border-radius:20px;background-color:var(--soft);background-position:center;background-size:cover;background-repeat:no-repeat;box-shadow:inset 0 0 0 0 var(--lamp);transition:box-shadow .2s}
.tile[aria-pressed="true"]{box-shadow:inset 0 0 0 4px var(--lamp)}
.tick{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.8);border:2px solid rgba(34,40,58,.35);display:grid;place-items:center;color:var(--on-lamp)}
.tile[aria-pressed="true"] .tick{background:var(--lamp);border-color:var(--lamp)}

/* art */
.art{flex:none;border-radius:20px;background-color:var(--soft);background-position:center;background-size:cover;background-repeat:no-repeat;width:100%}
.art.ph{display:grid;place-items:center;background:radial-gradient(circle at 50% 60%,var(--glow),transparent 60%),var(--soft)}
.art.ph span{font:italic 400 15px/1.3 var(--f-display);color:var(--muted)}

/* people */
.card{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px 12px 12px;border:1px solid var(--line);border-radius:16px;background:var(--surface);text-align:left;color:var(--ink)}
.card .pic{flex:none;width:68px;height:68px;border-radius:12px;background-color:var(--soft);background-position:center;background-size:cover;background-repeat:no-repeat;display:grid;place-items:center;font:400 26px/1 var(--f-display);color:var(--lamp-deep)}
.card .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.card .n{font:400 22px/1.15 var(--f-display)}.card .r{font-size:12.5px;color:var(--muted)}.card .l{font-size:14px;line-height:1.4}

/* story & scripture */
.story p{margin:0 0 12px;font-size:16px;line-height:1.6}
.ours{margin:0;font:italic 400 16px/1.45 var(--f-display);color:var(--muted)}
.scr{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 20px 16px;display:flex;flex-direction:column;gap:12px}
.scr-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.scr-ref{font:400 23px/1.2 var(--f-display)}.scr-tr{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.06em}
.v{margin:0;font:400 20px/1.45 var(--f-display)}
.v sup{font:600 11px/1 var(--f-body);color:var(--muted);margin-right:4px;vertical-align:5px}
.note{background:var(--soft);border-radius:14px;padding:14px 16px;font-size:14.5px;line-height:1.45;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.note p{margin:0}

/* fields */
.field{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:12px 14px 8px;display:flex;flex-direction:column;gap:4px}
.field:focus-within{border-color:var(--lamp)}
.field textarea,.field input{border:0;background:transparent;resize:none;outline:none;width:100%;padding:0;font-size:15.5px;line-height:1.45}
.field textarea::placeholder,.field input::placeholder{color:var(--muted);opacity:.8}
.count{align-self:flex-end;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.flabel{margin:0;font-size:14px;font-weight:700}

/* connection prompt */
.connect{background:var(--soft);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.connect h3{margin:0;font:400 21px/1.25 var(--f-display)}
.connect .q{margin:0;font-size:15px;line-height:1.45}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:9px 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--lamp);border-color:var(--lamp);color:var(--on-lamp)}
.connect .resp{margin:0;font-size:15px;line-height:1.45;color:var(--muted)}

/* respond tiles */
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rtile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:118px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);text-align:left;color:var(--ink);position:relative}
.rtile .t{font-weight:700;font-size:15px}.rtile .s{font-size:12.5px;line-height:1.35;color:var(--muted)}
.rtile[aria-expanded="true"]{background:var(--lamp);border-color:var(--lamp);color:var(--on-lamp)}
.rtile[aria-expanded="true"] .s{color:var(--on-lamp);opacity:.8}
.done{position:absolute;top:12px;right:12px;font-size:11.5px;font-weight:700;color:var(--lamp-deep)}
.rtile[aria-expanded="true"] .done{color:var(--on-lamp)}
.panel{border:1px solid var(--chosen-line);background:var(--chosen);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;animation:rise .25s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.panel h2{font-size:23px}
.panel p{margin:0;font-size:15px;line-height:1.5}
.panel .prayer{font:italic 400 19px/1.45 var(--f-display);color:var(--ink)}
.panel .quote{font:400 18px/1.45 var(--f-display);border-left:3px solid var(--lamp);padding-left:12px;color:var(--ink)}
.timer{display:flex;align-items:center;gap:16px}
.timer b{font:600 22px/1 var(--f-body);font-variant-numeric:tabular-nums}

/* sheets */
.scrim{position:absolute;inset:0;z-index:5;background:var(--scrim);display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--bg);border-radius:28px 28px 0 0;padding:14px 24px 30px;display:flex;flex-direction:column;gap:12px;max-height:92%;overflow-y:auto}
.grab{align-self:center;width:40px;height:4px;border-radius:2px;background:var(--line);margin-bottom:6px;flex:none}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:90px;padding:10px 8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--lamp);border-color:var(--lamp);color:var(--on-lamp)}
.confirm{background:var(--soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}

/* moments */
.mcard{display:flex;flex-direction:column;gap:4px;width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);text-align:left;color:var(--ink)}
.mcard .w{font-size:12.5px;color:var(--muted)}.mcard .n{font:400 21px/1.2 var(--f-display)}.mcard .i{font-size:13.5px;color:var(--muted)}
.mitem{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.mitem .k{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mitem p{margin:0;font-size:15.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}

/* help */
.draft{background:var(--draft-bg);color:var(--draft-ink);border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:700}
.hrow{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.hrow .t{font-weight:700}.hrow .s{font-size:14px;color:var(--muted);line-height:1.45}.hrow .num{font:600 20px/1.2 var(--f-body);user-select:all}

/* her phone, simulated */
.os{flex:1;display:flex;flex-direction:column;background:var(--os);color:var(--os-ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;min-height:0}
.os-banner{flex:none;padding:12px 16px 10px;text-align:center;background:#2E2810;color:#F0D270;font-size:11.5px;font-weight:700;padding-top:26px}
.os-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:20px 20px 30px}
.os-h{font-size:26px;font-weight:700;margin:0}.os-sub{font-size:13px;color:var(--os-muted);margin:0}
.os-row{display:flex;align-items:center;gap:12px;padding:14px;border:0;border-radius:12px;background:var(--os-row);color:var(--os-ink);text-align:left;font-size:16px}
.os-av{flex:none;width:36px;height:36px;border-radius:50%;background:#3A3A3C}
.os-bubble{align-self:flex-end;max-width:86%;background:var(--os-blue);color:#fff;border-radius:18px;padding:12px 16px;font-size:15px;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.os-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.os-send{height:48px;border:0;border-radius:12px;background:var(--os-blue);color:#fff;font-size:16px;font-weight:600}
.os-cancel{height:48px;border:0;border-radius:12px;background:#2C2C2E;color:#fff;font-size:16px}

/* companion card */
.ccard{flex:1;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px}
.cstep{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ctitle{font:400 26px/1.2 var(--f-display);margin:0}
.cquote{margin:0;border-left:3px solid var(--lamp);padding:2px 0 2px 14px;font-size:16px;line-height:1.45;font-weight:500}
.cguide{margin:0;font-size:15px;line-height:1.5;color:var(--muted)}
.chip{font-size:10.5px;font-weight:700;letter-spacing:.08em;padding:3px 7px;border-radius:6px;background:var(--draft-bg);color:var(--draft-ink)}
.cbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cfoot{display:flex;justify-content:space-between;gap:10px}
.cfoot .lnk{font-size:13.5px;padding:4px 0}

.toast{position:absolute;left:24px;right:24px;bottom:110px;z-index:6;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px;text-align:center}

const FLOW = ['PICS','DESC','WHO','MEET','STORY','SCRIPTURE','BREATH','RESONATE','RESPOND','KEEP','THANKS'];
const PROG = {NOWORDS:'PICS', PSALM:'SCRIPTURE'};

const IN_FLOW = new Set([...FLOW.filter(x => x !== 'THANKS'), 'NOWORDS', 'PSALM', 'TOGETHER', 'MODE']);

/* ---------- small builders ---------- */
const go = (label, act, arg = '', dis = false) => `<button class="go" data-a="${act}" data-v="${esc(arg)}"${dis ? ' aria-disabled="true"' : ''}>${label}</button>`;
const sec = (label, act, arg = '') => `<button class="sec" data-a="${act}" data-v="${esc(arg)}">${label}</button>`;
const lnk = (label, act, arg = '', muted = false) => `<button class="lnk${muted ? ' muted' : ''}" data-a="${act}" data-v="${esc(arg)}">${label}</button>`;
const radio = (t, on, act, arg, small = '') => `<button class="line" role="radio" aria-checked="${on}" data-a="${act}" data-v="${esc(arg)}"><span class="ring"></span><span class="tx">${t}${small ? `<small>${small}</small>` : ''}</span></button>`;
const check = (t, on, act, arg, small = '') => `<button class="line" aria-pressed="${on}" data-a="${act}" data-v="${esc(arg)}"><span class="box">${on ? I.check : ''}</span><span class="tx">${t}${small ? `<small>${esc(small)}</small>` : ''}</span></button>`;
const field = (key, ph, max, rows, id, label = '') => `<div class="field"><textarea id="${id}" data-bind="${key}" rows="${rows}" maxlength="${max}" placeholder="${esc(ph)}" aria-label="${esc(label || ph)}">${esc(st[key])}</textarea><span class="count" data-count="${key}">${st[key].length} / ${max}</span></div>`;
const art = (cls, h, alt, ph = 'Illustration to come') => cls ? `<div class="art art-${cls}" style="height:${h}px" role="img" aria-label="${esc(alt)}"></div>` : `<div class="art ph" style="height:${h}px"><span>${ph}</span></div>`;
const trOf = t => String(t || '').replace('?', '');
const sheet = inner => `<div class="scrim" data-a="scrim"><div class="sheet" role="dialog" aria-modal="true"><span class="grab"></span>${inner}</div></div>`;
const when = ts => { const d = new Date(ts); return d.toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'}) + ', ' + d.toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'}); };

function top({back = false, close = false, home = false, help = true, gear = false, word = !back} = {}){
  const left = back ? `<button class="backb" data-a="back">${I.back}Back</button>` : (word ? `<span class="word"><span class="dot"></span>KNOWN</span>` : '<span></span>');
  let right = '';
  if (home) right = `<button class="helpb" data-a="to" data-v="HELP">${I.help}Need help now?</button>`;
  else if (help) right = `<button class="ib" data-a="to" data-v="HELP" aria-label="Need help now?">${I.help}</button>`;
  if (gear) right += `<button class="ib" data-a="ov" data-v="SETTINGS" aria-label="Settings">${I.gear}</button>`;
  if (close) right += `<button class="ib" data-a="ov" data-v="STOP" aria-label="Stop for now">${I.close}</button>`;
  return `<div class="top"><div class="tl">${left}</div><div class="tr">${right}</div></div>`;
}
const progBar = f => f === null ? '' : `<div class="prog" role="progressbar" aria-label="Progress through this moment" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(f * 100)}"><i style="width:${(f * 100).toFixed(1)}%"></i></div>`;
function std({t = {}, body = '', actions = '', center = false}){
  return `${top(t)}${progBar(progOf(st.screen))}<div class="content${center ? ' center' : ''}" data-scroll>${body}</div>${actions ? `<div class="actions">${actions}</div>` : ''}`;
}
const flowTop = (extra = {}) => Object.assign({back:true, close:true}, extra);
const pp = () => P[st.pathway];
const scrBlock = (ref, tr, verses) => `<div class="scr"><div class="scr-head"><span class="scr-ref">${ref}</span><span class="scr-tr">${trOf(tr)}</span></div>${verses.map(([n, v]) => `<p class="v"><sup>${n}</sup>${v}</p>`).join('')}</div>`;

function scores(feel){
  const s = {ruth:0, nehemiah:0, david:0, hagar:0};
  const w = feel && WEIGHTS[feel]; if (w) for (const k in w) s[k] += w[k];
  return s;
}
function whoView(){
  const sc = scores(st.feel);
  const any = ORDER.some(k => sc[k] > 0);
  if (st.s06 === 'all' || !any) return {mode:'all', list:ORDER.slice(), swap:false};
  const best = ORDER.filter(k => sc[k] > 0 && ORDER.filter(j => sc[j] > sc[k]).length < 3);
  const list = (st.swapped ? ORDER.filter(k => !best.includes(k)) : best).slice().sort((a, b) => sc[b] - sc[a] || ORDER.indexOf(a) - ORDER.indexOf(b));
  return {mode:'best', list, swap:best.length < 4};
}

const fmt = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

function keepItems(){
  const out = [];
  if (st.pathway){ const p = pp(); out.push({id:'scripture', label:'The Scripture', detail:`${p.ref.replace('-', '–')} · ${p.name}`, text:`${p.ref.replace('-', '–')} (${trOf(p.tr)})\n${p.verses.map(v => v[1]).join(' ')}`}); }
  else if (st.psalm){ const ps = PSALMS[st.psalm]; out.push({id:'scripture', label:'The Scripture', detail:ps.ref, text:`${ps.ref} (NIV)\n${ps.verses.map(v => v[1]).join(' ')}`}); }
  if (st.pathway && st.rec.choice !== null){ const t = st.rec.choice === 'else' ? (st.note.trim() || 'Something else') : pp().rec[st.rec.choice]; out.push({id:'resonated', label:'What resonated with me', detail:t, text:t}); }
  if (st.prayer.trim()) out.push({id:'prayer', label:'My prayer', detail:st.prayer.trim(), text:st.prayer.trim()});
  if (st.reflect.trim()) out.push({id:'reflect', label:'My reflection', detail:st.reflect.trim(), text:st.reflect.trim()});
  if (st.sent && st.msg.trim()) out.push({id:'message', label:'The message I sent', detail:st.msg.trim(), text:st.msg.trim()});
  return out;
}

/* ---------- companion card ---------- */
function COMPANION(){
  const n = COMP.length, i = st.ci;
  const head = `${top({help:false, gear:true})}${progBar(st.cview === 'card' ? (i + 1) / n : st.cview === 'done' ? 1 : (i + 1) / n)}<div class="content">
    <p class="eyebrow">Companion card</p>
    <h1 class="sm">You’re here to accompany someone.</h1>
    <p class="lead">This card never shows what they choose or write. You move it forward yourself.</p>`;
  let card = '', actions = '';
  if (st.cview === 'card'){
    const [t, q, g, draft] = COMP[i];
    card = `<div class="ccard"><div class="cstep"><span>Step ${i + 1} of ${n}</span>${draft ? '<span class="chip">DRAFT</span>' : ''}</div><h2 class="ctitle">${t}</h2><p class="cquote">${q}</p><p class="cguide">${g}</p></div>`;
    actions = `<div class="cbtns"><button class="sec" data-a="cback"${i === 0 ? ' aria-disabled="true"' : ''}>Back</button>${go(i === n - 1 ? 'Finish' : 'Next step', 'cnext')}</div>
      <div class="cfoot">${lnk('They want to stop', 'cview', 'stop')}${lnk('If you’re worried about them', 'cview', 'worried')}</div>`;
  } else if (st.cview === 'done'){
    card = `<div class="ccard"><h2 class="ctitle">Thank you for being there.</h2><p class="cguide">You can close this page. This card never saw what they chose or wrote.</p></div>`;
    actions = sec('Start the card again', 'crestart');
  } else if (st.cview === 'stop'){
    card = `<div class="ccard"><h2 class="ctitle">It’s okay to stop</h2><p class="cguide">On their phone, they can save their place for later or end without saving. There’s nothing you need to do in KNOWN.</p><p class="cquote">“We can stop here. You don’t have to finish.”</p></div>`;
    actions = `<div class="cbtns">${sec('Back to the card', 'cview', 'card')}${go('Close this card', 'cview', 'done')}</div>`;
  } else {
    card = `<div class="ccard"><div class="cstep"><span>Placeholder</span><span class="chip">KEZIA</span></div><h2 class="ctitle">If you’re worried about them</h2><p class="cguide">Kezia is writing this step: what to do if the person you’re with seems distressed or unsafe. Safety wording is reviewed by Kezia before it’s added.</p></div>`;
    actions = sec('Back to the card', 'cview', 'card');
  }
  return `${head}${card}</div><div class="actions">${actions}</div>`;
}

/* ---------- render ---------- */
let sitTimer = null;
function render(scrollTop = true){
  const prev = phone.querySelector('[data-scroll]'), keep = prev ? prev.scrollTop : 0;
  let html;
  if (st.screen === 'COMPANION') html = COMPANION();
  else html = R[st.screen]();
  if (st.overlay) html += OV[st.overlay]();
  if (st.toast) html += `<div class="toast" role="status">${esc(st.toast)}</div>`;
  phone.innerHTML = html;
  const sc = phone.querySelector('[data-scroll]');
  if (sc) sc.scrollTop = scrollTop ? 0 : keep;
  clearInterval(sitTimer); sitTimer = null;
  if (st.screen === 'RESPOND' && st.open === 'sit' && st.sit && st.sit.end > Date.now()){
    sitTimer = setInterval(() => {
      const left = st.sit ? st.sit.end - Date.now() : 0, el = $('#sit-left');
      if (left <= 0){ st.sit = null; if (!st.tried.includes('sit')) st.tried.push('sit'); render(false); }
      else if (el) el.textContent = fmt(left);
    }, 500);
  }
}
function to(id){ st.hist.push(st.screen); st.screen = id; st.overlay = null; st.confirm = false; st.toast = ''; render(); }
function back(){ st.overlay = null; st.confirm = false; st.screen = st.hist.length ? st.hist.pop() : (D.role === 'companion' ? 'COMPANION' : 'HOME'); render(); }
function homeScreen(){ return D.role === 'companion' ? 'COMPANION' : 'HOME'; }
function toast(msg){ st.toast = msg; render(false); setTimeout(() => { if (st.toast === msg){ st.toast = ''; const t = phone.querySelector('.toast'); if (t) t.remove(); } }, 2600); }

function act(a, v, el, ev = {}){
  switch (a){
    case 'to': return to(v);
    case 'back': return back();
    case 'home': st = fresh(); st.screen = homeScreen(); return render();
    case 'ov': st.overlay = v; st.confirm = false; return render(false);
    case 'ovclose': st.overlay = null; st.confirm = false; return render(false);
    case 'scrim': if (el === ev.target){ st.overlay = null; st.confirm = false; render(false); } return;
    case 'role': D.role = v; persist(); st = fresh(); st.screen = homeScreen(); return render();
    case 'switchRole': st = fresh(); st.screen = 'ROLE'; return render();
    case 'theme': D.theme = v; persist(); applyTheme(); return render(false);
    case 'confirm': st.confirm = true; return render(false);
    case 'unconfirm': st.confirm = false; return render(false);
    case 'clearDevice': { const role = D.role, theme = D.theme; D = def(); D.role = role; D.theme = theme; persist(); st = fresh(); st.screen = homeScreen(); return toast('This phone is clear. Ready for the next tester.'); }
    case 'begin': { const v0 = D.visits; D.visits++; persist(); st = Object.assign(fresh(), {hist:['HOME']}); st.screen = v0 < 3 ? 'MODE' : 'PICS'; return render(); }
    case 'img': { const i = st.imgs.indexOf(v); if (i >= 0) st.imgs.splice(i, 1); else if (st.imgs.length < 2) st.imgs.push(v); else { st.imgs.shift(); st.imgs.push(v); } st.feel = null; return render(false); }
    case 'picsNext': if (!st.imgs.length) return; st.psalm = null; return to('DESC');
    case 'feel': st.feel = v; return render(false);
    case 'descNext': if (!st.feel) return; st.s06 = 'best'; st.swapped = false; return to('WHO');
    case 'swap': st.swapped = !st.swapped; return render(false);
    case 'toAll': st.s06 = 'all'; st.swapped = false; st.overlay = null; return to('WHO');
    case 'toPics': st.overlay = null; st.imgs = []; st.feel = null; return to('PICS');
    case 'pick': st.pathway = v; st.psalm = null; st.rec = {choice:null, answer:null}; st.note = ''; st.open = null; st.tried = []; st.keep = {}; return to('MEET');
    case 'psalm': st.psalm = v; st.pathway = null; if (st.screen === 'PSALM') return render(); return to('PSALM');
    case 'breathNext': return to(st.pathway ? 'RESONATE' : 'RESPOND');
    case 'rec': { const c = v === 'else' ? 'else' : Number(v); st.rec = {choice: st.rec.choice === c ? null : c, answer:null}; render(false); { const k = $('#phone .connect'); if (k) k.scrollIntoView({block:'nearest', behavior:'smooth'}); } return; }
    case 'ans': st.rec.answer = v; return render(false);
    case 'tile': st.open = st.open === v ? null : v; render(false); { const p = $('#panel'); if (p) p.scrollIntoView({block:'nearest', behavior:'smooth'}); } return;
    case 'tried': if (!st.tried.includes(v)) st.tried.push(v); return render(false);
    case 'sitStart': st.sit = {end: Date.now() + 60000}; return render(false);
    case 'sitStop': st.sit = null; if (!st.tried.includes('sit')) st.tried.push('sit'); return render(false);
    case 'sent': st.sent = true; if (!st.tried.includes('reach')) st.tried.push('reach'); st.open = 'reach'; st.hist = st.hist.filter(h => h !== 'CONTACTS' && h !== 'SEND'); st.screen = 'RESPOND'; return render();
    case 'invited': st.invited = true; st.hist = st.hist.filter(h => h !== 'INVITE' && h !== 'INVITE2'); st.screen = 'TOGETHER'; return render();
    case 'keep': st.keep[v] = !st.keep[v]; return render(false);
    case 'saveMoment': {
      const items = keepItems().filter(i => st.keep[i.id]); if (!items.length) return;
      const who = st.pathway ? `${pp().name} · ${pp().passage}` : PSALMS[st.psalm].ref;
      D.moments.unshift({id:'m' + Date.now().toString(36), ts:Date.now(), who, items:items.map(i => ({label:i.label, text:i.text}))}); D.saved = null; persist();
      st.kept = true; st.hist = []; st.screen = 'THANKS'; return render(); }
    case 'finish': st.kept = false; D.saved = null; persist(); st.hist = []; st.screen = 'THANKS'; return render();
    case 'another': { const n = fresh(); n.s06 = 'all'; n.offerAnother = false; n.hist = ['HOME']; st = n; st.screen = 'WHO'; return render(); }
    case 'saveStep': D.saved = {screen: st.screen, imgs: st.imgs, feel: st.feel, s06: st.s06, swapped: st.swapped, pathway: st.pathway, psalm: st.psalm}; persist(); st = fresh(); st.screen = 'PAUSED'; return render();
    case 'endNoSave': D.saved = null; persist(); st = fresh(); st.screen = 'HOME'; return render();
    case 'resume': { const s = D.saved; if (!s) { st = fresh(); return render(); } st = Object.assign(fresh(), {imgs:s.imgs || [], feel:s.feel, s06:s.s06 || 'best', swapped:!!s.swapped, pathway:s.pathway, psalm:s.psalm, hist:['HOME']});
      st.screen = R[s.screen] ? s.screen : 'PICS'; if ((st.screen === 'MEET' || st.screen === 'STORY' || st.screen === 'SCRIPTURE' || st.screen === 'RESONATE') && !st.pathway) st.screen = 'PICS';
      D.saved = null; persist(); return render(); }
    case 'newmoment': D.saved = null; persist(); st = fresh(); return render();
    case 'openMoment': st.moment = v; return to('MOMENT');
    case 'removeMoment': D.moments = D.moments.filter(m => m.id !== st.moment); persist(); st.confirm = false; st.hist.pop(); st.screen = 'MOMENTS'; return render();
    /* companion */
    case 'cnext': if (st.ci < COMP.length - 1){ st.ci++; render(); } else { st.cview = 'done'; render(); } return;
    case 'cback': if (st.ci > 0){ st.ci--; render(); } return;
    case 'cview': st.cview = v; return render();
    case 'crestart': st.ci = 0; st.cview = 'card'; return render();
  }
}

phone.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || !phone.contains(b)) return;
  if (b.getAttribute('aria-disabled') === 'true') return;
  act(b.dataset.a, b.dataset.v, b, e);
});
phone.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.bind; if (!k) return;
  st[k] = e.target.value;
  const c = phone.querySelector(`[data-count="${k}"]`); if (c) c.textContent = `${e.target.value.length} / ${e.target.maxLength}`;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && st.overlay){ st.overlay = null; render(false); } });

/* start */
if (!D.role) st.screen = 'ROLE';
else if (D.role === 'companion') st.screen = 'COMPANION';
else st.screen = D.saved ? 'WELCOME' : 'HOME';
render();
})();
</script>
